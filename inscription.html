<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - MiniForum</title>
</head>
<body>

    <header>
        <h1>MiniForum</h1>
        <nav>
             <li><a href="index.html">Accueil</a></li>
             <li><a href="#sujets">Sujets</a></li>
             <li><a href="inscription.html">Inscription</a></li>
             <li><a href="connexion.html">Connexion</a></li>
        </nav>
    </header>

    <main>
        <h2>Créer un compte</h2>

        <form action="/inscription" method="post">

            <fieldset>
                <legend>Identifiants</legend>

                <label for="pseudo">Pseudo :</label>
                <input
                    type="text"
                    id="pseudo"
                    name="pseudo"
                    required
                    pattern="[A-Za-z0-9]{3,15}"
                    title="Le pseudo doit contenir entre 3 et 15 lettres ou chiffres."
                >
                <br><br>

                <label for="email">Adresse e-mail :</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
                <br><br>

                <label for="motdepasse">Mot de passe :</label>
                <input
                    type="password"
                    id="motdepasse"
                    name="motdepasse"
                    required
                    minlength="8"
                >
                <br><br>

                <label for="naissance">Date de naissance :</label>
                <input
                    type="date"
                    id="naissance"
                    name="naissance"
                >
            </fieldset>

            <br>

            <fieldset>
                <legend>Préférences</legend>

                <input
                    type="checkbox"
                    id="newsletter"
                    name="newsletter"
                >
                <label for="newsletter">Recevoir la newsletter</label>
                <br><br>

                <input
                    type="checkbox"
                    id="cgu"
                    name="cgu"
                    required
                >
                <label for="cgu">J'accepte les conditions générales d'utilisation</label>
            </fieldset>

            <br>

            <button type="submit">S'inscrire</button>

        </form>

        <p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
    </main>

    <footer>
        <p>&copy; 2026 MiniForum</p>
    </footer>

</body>
</html>
