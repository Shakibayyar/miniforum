<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MiniForum</title>
</head>
<body>

    <header>
        <h1>MiniForum</h1>
        <nav>
             <li><a href="index.html">Accueil</a></li>
             <li><a href="#sujets">Sujets</a></li>
             <li><a href="inscription.html">Inscription</a></li>
             <li><a href="connexion.html">Connexion</a></li>
        </nav>
    </header>

    <main>
        <h2>Se connecter</h2>

        <form action="/connexion" method="post">

            <fieldset>
                <legend>Vos identifiants</legend>

                <label for="identifiant">Identifiant :</label>
                <input
                    type="text"
                    id="identifiant"
                    name="identifiant"
                    required
                >
                <br><br>

                <label for="motdepasse">Mot de passe :</label>
                <input
                    type="password"
                    id="motdepasse"
                    name="motdepasse"
                    required
                >
                <br><br>

                <input
                    type="checkbox"
                    id="rester-connecte"
                    name="rester-connecte"
                >
                <label for="rester-connecte">Rester connecté</label>

            </fieldset>

            <br>

            <button type="submit">Se connecter</button>

        </form>

        <p>Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
    </main>

    <footer>
        <p>&copy; 2026 MiniForum</p>
    </footer>

</body>
</html>
